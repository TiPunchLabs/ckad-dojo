[project]
name = "ckad-dojo"
version = "1.7.0"
description = "CKAD Exam Simulator - Practice for Kubernetes certification"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ckad-dojo contributors" }]
keywords = ["kubernetes", "ckad", "exam", "simulator", "certification"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
]
dependencies = ["argcomplete>=3.6.3"]

[project.scripts]
ckad-server = "web.server:main"
ckad-dojo = "ckad_dojo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["web", "ckad_dojo.py"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [".venv", ".specify", "specs", "__pycache__"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "S",    # flake8-bandit (security)
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line-length (handled by formatter)
    "S603",   # subprocess calls — expected in CLI tool
    "S607",   # partial executable path — kubectl, helm are standard
    "A002",   # shadowing builtins — argparse `help`/`format` params are standard
    "RUF001", # ambiguous unicode — intentional scoring markers (✗✘×)
    "SIM108", # ternary operator — keep if/else for readability
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is expected in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "argcomplete"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "--strict-markers -v"

[tool.coverage.run]
source = ["ckad_dojo", "web", "scripts"]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
fail_under = 30
show_missing = true
exclude_lines = [
    "if __name__ == .__main__.",
    "pragma: no cover",
]

[dependency-groups]
dev = ["mypy>=1.20.1", "pre-commit>=4.5.1", "pytest>=9.0.3", "pytest-cov>=7.1.0"]
