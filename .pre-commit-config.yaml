---
repos:
  # =============================================================================
  # General hooks
  # =============================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: (^\.venv/|^\.specify/)
      - id: trailing-whitespace
        exclude: (^\.venv/|^\.specify/)
      - id: check-merge-conflict
      - id: check-yaml
        files: \.(yml|yaml)$
        # Helm chart templates contain Go templating and are not valid YAML
        exclude: (^\.venv/|-chart/templates/)
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=500]

  # =============================================================================
  # Security
  # =============================================================================
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      - id: gitleaks

  # =============================================================================
  # Commit message
  # =============================================================================
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.6.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # =============================================================================
  # Shell
  # =============================================================================
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.12.0-2
    hooks:
      - id: shfmt
        exclude: (^\.venv/|^\.specify/)

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
        exclude: (^\.envrc$|^\.venv/|^\.specify/)

  # =============================================================================
  # GitHub Actions
  # =============================================================================
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint

  # =============================================================================
  # YAML
  # =============================================================================
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
        files: \.(yml|yaml)$
        # Helm chart templates contain Go templating and are not valid YAML
        exclude: (^\.venv/|-chart/templates/)

  # =============================================================================
  # Python
  # =============================================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.1
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        exclude: (^\.venv/|^\.specify/)
      - id: ruff-format
        exclude: (^\.venv/|^\.specify/)

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        exclude: (^\.venv/|^\.specify/)
        additional_dependencies: [argcomplete>=3.0]

  # =============================================================================
  # Markdown
  # =============================================================================
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.16.0
    hooks:
      - id: markdownlint-cli2
        args: ["--fix"]
        exclude: (^\.venv/|^\.specify/|CHANGELOG\.md)

  # =============================================================================
  # Spelling
  # =============================================================================
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args:
          - "--skip"
          - ".venv,*.lock,*.json,CLAUDE.md,.specify,specs"
          - "--ignore-words-list"
          - "nd,ans,aks,iam,ro,ngnix,uptodate,projet,vie,gere,methode,fonctions,ressources,reponse,reponses,fonction,verifie,defaut,dependance,dependances,independant"
        exclude: (^\.venv/|^\.specify/|^specs/|^\.claude/commands/)
