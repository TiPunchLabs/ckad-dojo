# CKAD Simulation 14 Configuration - Raijin (Thunder God)

EXAM_NAME="ckad-simulation14"
EXAM_ID="ckad-sim-14"
EXAM_VERSION="1.0.0"

# Dojo Theme details
DOJO_NAME="Dojo Raijin"
DOJO_EMOJI="⚡"
DOJO_TITLE="Raijin of the Thunder"
DOJO_QUOTE="「雷神は天を裂く」- Raijin splits the heavens"

# Timer settings
EXAM_DURATION=120
EXAM_WARNING_TIME=15
ALLOW_TIMER_PAUSE=true
ALLOW_HINTS=true

# Scoring
TOTAL_QUESTIONS=20
PREVIEW_QUESTIONS=0
TOTAL_POINTS=112
PASSING_PERCENTAGE=66

# Namespaces to create (Raijin theme)
EXAM_NAMESPACES=("thunder" "bolt" "storm" "voltage" "spark" "charge" "surge" "flash" "strike" "plasma")

# Helm specific configurations
HELM_NAMESPACE="surge"
HELM_RELEASES=("thunder-web")

# Registry for images
REGISTRY_HOST="localhost"
REGISTRY_PORT="5000"
REGISTRY_NAME="registry"

# Working directories
EXAM_PATH_PREFIX="/opt/course"
LOCAL_PATH_PREFIX="exam/course"
QUESTIONS_FILE="questions.md"
SCORING_FUNCTIONS="scoring-functions.sh"
