# CKAD Simulation 1 - Exam Configuration
# This file defines the exam parameters for the CKAD Simulator

# Exam metadata
EXAM_NAME="CKAD Simulation 1"
EXAM_ID="ckad-simulation1"
EXAM_VERSION="1.0"

# Dojo identity (Shishin - Four Celestial Guardians)
DOJO_NAME="Dojo Suzaku"
DOJO_EMOJI="🔥"
DOJO_TITLE="Phénix Vermillon du Sud"
DOJO_QUOTE="The phoenix rises from the ashes. Every mistake forges your mastery."

# Timer settings (in minutes)
EXAM_DURATION=120
EXAM_WARNING_TIME=15
ALLOW_TIMER_PAUSE=true
ALLOW_HINTS=true

# Scoring settings
TOTAL_QUESTIONS=21
PREVIEW_QUESTIONS=1
TOTAL_POINTS=112
PASSING_PERCENTAGE=66

# Namespaces required for this exam (fire/phoenix theme - Suzaku)
EXAM_NAMESPACES=(
    "phoenix"
    "ember"
    "blaze"
    "inferno"
    "flame"
    "spark"
    "solar"
    "corona"
    "flare"
    "magma"
)

# Helm releases for this exam
HELM_NAMESPACE="flare"
HELM_RELEASES=(
    "phoenix-web"
)

# Registry configuration
REGISTRY_HOST="localhost"
REGISTRY_PORT="5000"
REGISTRY_NAME="registry"

# Directory mappings
# Exam path -> Local path (relative to exam directory)
EXAM_PATH_PREFIX="/opt/course"
LOCAL_PATH_PREFIX="exam/course"

# Questions file
QUESTIONS_FILE="questions.md"

# Scoring functions file
SCORING_FUNCTIONS="scoring-functions.sh"
