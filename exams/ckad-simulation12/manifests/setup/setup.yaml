---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: critical-processor
  namespace: nightfall
spec:
  replicas: 2
  selector:
    matchLabels:
      app: critical
  template:
    metadata:
      labels:
        app: critical
    spec:
      containers:
      - name: app
        image: nginx:1.24
---
apiVersion: v1
kind: Pod
metadata:
  name: metrics-gatherer
  namespace: starlight
spec:
  containers:
  - name: gatherer
    image: nginxxxxx:alpine
---
apiVersion: v1
kind: Secret
metadata:
  name: db-creds
  namespace: crescent
type: Opaque
data:
  password: cGFzc3dvcmQxMjM=
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: crescent
data:
  color: blue
---
apiVersion: v1
kind: Secret
metadata:
  name: legacy-token
  namespace: shadow
type: Opaque
data:
  token: c3VwZXItc2VjcmV0LXYx
---
apiVersion: v1
kind: Pod
metadata:
  name: token-reader
  namespace: shadow
spec:
  containers:
  - name: reader
    image: busybox:1.36
    command: ["sleep", "3600"]
    volumeMounts:
    - name: secret-vol
      mountPath: /etc/secret
  volumes:
  - name: secret-vol
    secret:
      secretName: legacy-token
---
apiVersion: v1
kind: Pod
metadata:
  name: dns-tester
  namespace: void
spec:
  containers:
  - name: tester
    image: busybox:1.36
    command: ["sleep", "3600"]
