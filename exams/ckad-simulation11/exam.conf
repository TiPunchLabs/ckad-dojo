# CKAD Simulation 11 - Exam Configuration
# This file defines the exam parameters for the CKAD Simulator

# Exam metadata
EXAM_NAME="CKAD Simulation 11"
EXAM_ID="ckad-simulation11"
EXAM_VERSION="1.0"

# Dojo identity (Amaterasu - Sun Goddess)
DOJO_NAME="Dojo Amaterasu"
DOJO_EMOJI="☀️"
DOJO_TITLE="Amaterasu of the Rising Sun"
DOJO_QUOTE="「天照は光を導く」- Amaterasu guides the light"

# Timer settings (in minutes)
EXAM_DURATION=120
EXAM_WARNING_TIME=15
ALLOW_TIMER_PAUSE=true
ALLOW_HINTS=true

# Scoring settings
TOTAL_QUESTIONS=20
PREVIEW_QUESTIONS=0
TOTAL_POINTS=102
PASSING_PERCENTAGE=66

# Namespaces required for this exam (Sun/Light theme)
EXAM_NAMESPACES=(
    "solar" "corona" "aurora" "flare" "dawn"
    "zenith" "eclipse" "radiance" "sunbeam" "solstice"
)

# Helm releases for this exam
HELM_NAMESPACE="radiance"
HELM_RELEASES=("web-release")

# Registry configuration
REGISTRY_HOST="localhost"
REGISTRY_PORT="5000"
REGISTRY_NAME="registry"

# Directory mappings
EXAM_PATH_PREFIX="/opt/course"
LOCAL_PATH_PREFIX="exam/course"

# Questions file
QUESTIONS_FILE="questions.md"

# Scoring functions file
SCORING_FUNCTIONS="scoring-functions.sh"
