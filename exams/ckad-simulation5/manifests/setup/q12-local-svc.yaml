# Q12 - Pre-existing Service for internalTrafficPolicy exercise
# Student will modify the Service to set internalTrafficPolicy: Local
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-deploy
  namespace: ocean
  labels:
    app: local-app
    exam: ckad-simulation5
spec:
  replicas: 2
  selector:
    matchLabels:
      app: local-app
  template:
    metadata:
      labels:
        app: local-app
    spec:
      containers:
      - name: nginx
        image: nginx:1.21
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: local-svc
  namespace: ocean
  labels:
    exam: ckad-simulation5
spec:
  type: ClusterIP
  selector:
    app: local-app
  ports:
  - port: 80
    targetPort: 80
