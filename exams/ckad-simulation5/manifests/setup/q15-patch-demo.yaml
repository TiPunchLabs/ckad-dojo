# Q15 - Pre-existing Deployment for kubectl patch exercise
# Student will use strategic merge patch and JSON patch to modify it
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: patch-demo
  namespace: tide
  labels:
    app: patch-demo
    exam: ckad-simulation5
spec:
  replicas: 2
  selector:
    matchLabels:
      app: patch-demo
  template:
    metadata:
      labels:
        app: patch-demo
    spec:
      containers:
      - name: nginx
        image: nginx:1.21
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
