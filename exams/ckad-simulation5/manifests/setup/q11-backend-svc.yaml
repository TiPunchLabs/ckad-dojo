# Q11 - Pre-existing Service and backing pods for EndpointSlice exercise
# Student will inspect EndpointSlices and document endpoint information
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deploy
  namespace: shell
  labels:
    app: backend
    exam: ckad-simulation5
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: nginx
        image: nginx:1.21
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  namespace: shell
  labels:
    exam: ckad-simulation5
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
  - port: 80
    targetPort: 80
