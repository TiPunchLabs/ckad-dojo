# CKAD Simulation 4 - Exam Configuration
# This file defines the exam parameters for the CKAD Simulator

# Exam metadata
EXAM_NAME="CKAD Simulation 4"
EXAM_ID="ckad-simulation4"
EXAM_VERSION="1.0"

# Dojo identity (Kappa - Water Spirit)
DOJO_NAME="Dojo Kappa"
DOJO_EMOJI="🐸"
DOJO_TITLE="Kappa des Rivières"
DOJO_QUOTE="「河童は水を知る」- The kappa knows the waters"
DOJO_CREDIT_TEXT="Based on CKAD-Practice-Questions by @aravind4799"
DOJO_CREDIT_URL="https://github.com/aravind4799/CKAD-Practice-Questions"

# Timer settings (in minutes)
EXAM_DURATION=120
EXAM_WARNING_TIME=15
ALLOW_TIMER_PAUSE=true
ALLOW_HINTS=true

# Scoring settings
TOTAL_QUESTIONS=17
PREVIEW_QUESTIONS=0
TOTAL_POINTS=91
PASSING_PERCENTAGE=66

# Namespaces required for this exam (River/Water theme)
EXAM_NAMESPACES=(
    "stream" "pond" "marsh" "delta" "spring"
    "brook" "rapids" "cascade" "shoal" "eddy"
)

# Helm releases for this exam
HELM_NAMESPACE="brook"
HELM_RELEASES=()

# Registry configuration
REGISTRY_HOST="localhost"
REGISTRY_PORT="5000"
REGISTRY_NAME="registry"

# Directory mappings
# Exam path -> Local path (relative to exam directory)
EXAM_PATH_PREFIX="/opt/course"
LOCAL_PATH_PREFIX="exam/course"

# Questions file
QUESTIONS_FILE="questions.md"

# Scoring functions file
SCORING_FUNCTIONS="scoring-functions.sh"
