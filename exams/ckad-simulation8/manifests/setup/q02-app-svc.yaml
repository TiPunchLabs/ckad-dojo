# Q2 - Pre-existing Service for NodePort conversion
apiVersion: v1
kind: Pod
metadata:
  name: app-pod
  namespace: grain
  labels:
    app: app
spec:
  containers:
  - name: nginx
    image: nginx
    ports:
    - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: app-svc
  namespace: grain
spec:
  type: ClusterIP
  selector:
    app: app
  ports:
  - port: 80
    targetPort: 80
