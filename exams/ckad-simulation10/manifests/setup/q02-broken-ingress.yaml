# Q2: Broken Ingress setup - Service is correct, Ingress has errors
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: bastion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: nginx:1.25
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: bastion
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
---
# Broken Ingress: wrong service name (frontend vs frontend-svc),
# wrong port (8080 vs 80), wrong pathType (Exact vs Prefix)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
  namespace: bastion
spec:
  rules:
  - host: frontend.example.com
    http:
      paths:
      - path: /
        pathType: Exact
        backend:
          service:
            name: frontend
            port:
              number: 8080
