# Setup for Q7
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server-blue
  namespace: rampart
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-server-blue
  template:
    metadata:
      labels:
        app: api-server-blue
    spec:
      containers:
      - name: nginx
        image: nginx:1.24.0-alpine
---
apiVersion: v1
kind: Service
metadata:
  name: api-svc
  namespace: rampart
spec:
  selector:
    app: api-server-blue
  ports:
  - port: 80
    targetPort: 80
---
# Setup for Q9
apiVersion: v1
kind: Pod
metadata:
  name: data-processor
  namespace: sentinel
spec:
  containers:
  - name: processor
    image: polinux/stress
    command: ["stress"]
    args: ["--vm", "1", "--vm-bytes", "150M", "--vm-hang", "1"]
    resources:
      requests:
        memory: "64Mi"
      limits:
        memory: "64Mi"
---
# Setup for Q10
apiVersion: v1
kind: Pod
metadata:
  name: secure-app
  namespace: outpost
spec:
  containers:
  - name: app
    image: gcr.io/distroless/static-debian11
    command: ["sleep", "3600"]
---
# Setup for Q11
apiVersion: v1
kind: ResourceQuota
metadata:
  name: armory-quota
  namespace: armory
spec:
  hard:
    requests.cpu: "500m"
    requests.memory: "1Gi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weapon-smith
  namespace: armory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weapon-smith
  template:
    metadata:
      labels:
        app: weapon-smith
    spec:
      containers:
      - name: app
        image: nginx:alpine
        resources:
          requests:
            cpu: "200m" # Incorrect, needs 100m
            memory: "512Mi" # Incorrect, needs 128Mi
---
# Setup for Q18
apiVersion: v1
kind: Service
metadata:
  name: main-svc
  namespace: sentinel
spec:
  ports:
  - port: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: main-ingress
  namespace: sentinel
spec:
  ingressClassName: nginx
  rules:
  - host: sentinel.dojo.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: main-svc
            port:
              number: 80
