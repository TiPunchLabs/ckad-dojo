# Q15 - Pre-existing Services for Ingress question
---
apiVersion: v1
kind: Service
metadata:
  name: api-svc
  namespace: poseidon
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: api-backend
---
apiVersion: v1
kind: Service
metadata:
  name: web-svc
  namespace: poseidon
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: web-frontend
