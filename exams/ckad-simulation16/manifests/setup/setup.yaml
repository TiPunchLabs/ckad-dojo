apiVersion: v1
kind: ConfigMap
metadata:
  name: haproxy-config
  namespace: melody
data:
  haproxy.cfg: |
    global
      daemon
      maxconn 256
    defaults
      mode http
      timeout connect 5000ms
      timeout client 50000ms
      timeout server 50000ms
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-app
  namespace: verse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: legacy
  template:
    metadata:
      labels:
        app: legacy
    spec:
      containers:
      - name: app
        image: nginx:1.14
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: info-cm
  namespace: melody
data:
  info.txt: "config data"
---
apiVersion: v1
kind: Secret
metadata:
  name: info-secret
  namespace: melody
stringData:
  secret.txt: "secret data"
---
apiVersion: v1
kind: Pod
metadata:
  name: metrics-pod
  namespace: tempo
spec:
  containers:
  - name: main
    image: nginx:alpine
    volumeMounts:
    - name: config
      mountPath: /etc/config
  volumes:
  - name: config
    configMap:
      name: metrics-config
---
apiVersion: v1
kind: Pod
metadata:
  name: heavy-worker
  namespace: aria
spec:
  containers:
  - name: main
    image: busybox
    command: ["sleep", "3600"]
---
apiVersion: v1
kind: Service
metadata:
  name: app1-svc
  namespace: lyric
spec:
  ports:
  - port: 80
  selector:
    app: app1
---
apiVersion: v1
kind: Service
metadata:
  name: app2-svc
  namespace: lyric
spec:
  ports:
  - port: 80
  selector:
    app: app2
---
apiVersion: v1
kind: Secret
metadata:
  name: app1-tls
  namespace: lyric
type: kubernetes.io/tls
data:
  tls.crt: base64crt
  tls.key: base64key
---
apiVersion: v1
kind: Secret
metadata:
  name: app2-tls
  namespace: lyric
type: kubernetes.io/tls
data:
  tls.crt: base64crt
  tls.key: base64key
---
apiVersion: v1
kind: Service
metadata:
  name: external-db-svc
  namespace: tempo
spec:
  ports:
  - port: 3306
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: external-db-slice
  namespace: tempo
  labels:
    kubernetes.io/service-name: external-db-svc
addressType: IPv4
ports:
- name: mysql
  port: 3306
endpoints:
- addresses:
  - "192.168.1.100"
  - "192.168.1.101"
