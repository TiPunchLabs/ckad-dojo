# Q7 - Pre-existing Deployment for PodDisruptionBudget exercise
# 5 replicas with label app: critical-app in namespace jungle
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: critical-app
  namespace: jungle
  labels:
    app: critical-app
    exam: ckad-simulation3
spec:
  replicas: 5
  selector:
    matchLabels:
      app: critical-app
  template:
    metadata:
      labels:
        app: critical-app
    spec:
      containers:
      - name: nginx
        image: nginx:1.21
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
