# Q12 - Pre-existing Pod for kubectl exec troubleshooting exercise
# Nginx pod with custom config listening on port 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-custom-config
  namespace: stalker
  labels:
    exam: ckad-simulation3
data:
  custom.conf: |
    server {
        listen 8080;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
        }
    }
---
apiVersion: v1
kind: Pod
metadata:
  name: config-pod
  namespace: stalker
  labels:
    app: config-pod
    exam: ckad-simulation3
spec:
  containers:
  - name: nginx
    image: nginx:1.21
    ports:
    - containerPort: 8080
    volumeMounts:
    - name: nginx-config
      mountPath: /etc/nginx/conf.d/custom.conf
      subPath: custom.conf
    resources:
      requests:
        memory: "64Mi"
        cpu: "100m"
      limits:
        memory: "128Mi"
        cpu: "200m"
  volumes:
  - name: nginx-config
    configMap:
      name: nginx-custom-config
