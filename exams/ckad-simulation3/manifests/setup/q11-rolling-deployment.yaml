# Q11 - Pre-existing Deployment for rollout control exercise
# Student will pause, update image, set revisionHistoryLimit, and resume
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rolling-app
  namespace: pounce
  labels:
    app: rolling-app
    exam: ckad-simulation3
spec:
  replicas: 3
  selector:
    matchLabels:
      app: rolling-app
  template:
    metadata:
      labels:
        app: rolling-app
    spec:
      containers:
      - name: nginx
        image: nginx:1.21
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
